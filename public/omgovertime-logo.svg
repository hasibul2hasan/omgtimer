<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#070c18" />
    </radialGradient>

    <!-- Overtime Fire Gradient -->
    <linearGradient id="overtimeGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#ff3366" />
      <stop offset="50%" stop-color="#ff5e3a" />
      <stop offset="100%" stop-color="#ffb020" />
    </linearGradient>

    <!-- Cyan Pulse Gradient -->
    <linearGradient id="cyanArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowSubtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="800" rx="160" fill="url(#bgGrad)" />

  <!-- Inner Subtle Grid/Circular Guide (Distraction-free precision feel) -->
  <circle cx="400" cy="350" r="230" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.6" />

  <!-- Confetti / Particle Burst in Upper-Right Quadrant -->
  <!-- Diamonds, dots, pills, confetti shards -->
  <g id="confetti" opacity="0.95">
    <!-- Star / Cross sparks -->
    <path d="M 570 160 L 575 175 L 590 180 L 575 185 L 570 200 L 565 185 L 550 180 L 565 175 Z" fill="#ffc837" />
    <path d="M 645 285 L 648 295 L 658 298 L 648 301 L 645 311 L 642 301 L 632 298 L 642 295 Z" fill="#00f2fe" opacity="0.8" />
    <path d="M 445 90 L 448 98 L 456 101 L 448 104 L 445 112 L 442 104 L 434 101 L 442 98 Z" fill="#ff3366" opacity="0.8" />

    <!-- Circles / Dots -->
    <circle cx="530" cy="120" r="7" fill="#ff3366" />
    <circle cx="610" cy="205" r="5.5" fill="#ffb020" />
    <circle cx="660" cy="235" r="8" fill="#4facfe" />
    <circle cx="485" cy="85" r="6" fill="#10b981" />
    <circle cx="640" cy="360" r="5" fill="#f43f5e" />
    <circle cx="340" cy="100" r="4.5" fill="#38bdf8" opacity="0.6" />

    <!-- Confetti Rectangles / Streamers angled outward -->
    <rect x="585" y="105" width="8" height="20" rx="3" fill="#ff5e3a" transform="rotate(35 585 105)" />
    <rect x="525" y="180" width="7" height="18" rx="2.5" fill="#00e5ff" transform="rotate(-28 525 180)" />
    <rect x="620" y="150" width="9" height="16" rx="3" fill="#a855f7" transform="rotate(55 620 150)" />
    <rect x="670" y="310" width="6" height="16" rx="2.5" fill="#ffc837" transform="rotate(70 670 310)" />
    <rect x="490" y="145" width="7" height="15" rx="2.5" fill="#10b981" transform="rotate(-40 490 145)" />
    <rect x="400" y="70" width="6" height="14" rx="2" fill="#ec4899" transform="rotate(15 400 70)" />

    <!-- Small Rings -->
    <circle cx="505" cy="75" r="11" fill="none" stroke="#ffb020" stroke-width="3.5" />
    <circle cx="680" cy="180" r="8" fill="none" stroke="#38bdf8" stroke-width="3" />
    <circle cx="605" cy="340" r="6" fill="none" stroke="#a855f7" stroke-width="2.5" />
  </g>

  <!-- Timer Hardware details (Top Stopwatch Pusher & Left Button) -->
  <!-- Top stem / Crown -->
  <rect x="382" y="125" width="36" height="35" rx="5" fill="#334155" />
  <rect x="360" y="112" width="80" height="16" rx="7" fill="#f8fafc" />

  <!-- Left Pusher (Lap/Sprint button at ~315 deg / top left) -->
  <g transform="rotate(-45 400 350)">
    <rect x="387" y="132" width="26" height="22" rx="4" fill="#334155" />
    <rect x="375" y="124" width="50" height="12" rx="5" fill="#94a3b8" />
  </g>

  <!-- Main Stopwatch Dial Arc -->
  <!-- Full background track -->
  <circle cx="400" cy="350" r="190" fill="none" stroke="#1e293b" stroke-width="24" stroke-linecap="round" />

  <!-- Remaining countdown arc: sweep from bottom/left up to ~12 o'clock -->
  <path d="M 215 385 A 190 190 0 1 1 400 160"
        fill="none"
        stroke="url(#cyanArc)"
        stroke-width="24"
        stroke-linecap="round" />

  <!-- Dial Tick Marks -->
  <!-- Major & Minor precision ticks -->
  <!-- 12 o'clock -->
  <line x1="400" y1="185" x2="400" y2="205" stroke="#f8fafc" stroke-width="5" stroke-linecap="round" />
  <!-- 9 o'clock -->
  <line x1="235" y1="350" x2="255" y2="350" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" />
  <!-- 6 o'clock -->
  <line x1="400" y1="515" x2="400" y2="495" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" />
  <!-- Other ticks -->
  <line x1="283" y1="233" x2="298" y2="248" stroke="#475569" stroke-width="4" stroke-linecap="round" />
  <line x1="283" y1="467" x2="298" y2="452" stroke="#475569" stroke-width="4" stroke-linecap="round" />
  <line x1="335" y1="500" x2="343" y2="483" stroke="#334155" stroke-width="3" stroke-linecap="round" />
  <line x1="465" y1="500" x2="457" y2="483" stroke="#334155" stroke-width="3" stroke-linecap="round" />

  <!-- DYNAMIC OVERTIME BURST: Breakthrough from 12 past zero into the future -->
  <!-- Overtime Energy Ray / Arrow launching upward & forward -->
  <g filter="url(#glowSubtle)">
    <!-- Expanding energy cone / wedge -->
    <path d="M 400 350 L 420 160 L 535 225 Z" fill="url(#overtimeGrad)" opacity="0.22" />
    
    <!-- Bold energetic Overtime Arc continuing past zero -->
    <path d="M 400 160 A 190 190 0 0 1 555 240"
          fill="none"
          stroke="url(#overtimeGrad)"
          stroke-width="26"
          stroke-linecap="round" />

    <!-- Big Dynamic Arrow Head shooting up-right (+ Overtime vector) -->
    <path d="M 470 190 L 575 145 L 530 250 L 515 210 Z"
          fill="url(#overtimeGrad)"
          stroke="#ff5e3a"
          stroke-width="2"
          stroke-linejoin="round" />
  </g>

  <!-- Stopwatch Center Digital Display -->
  <!-- Millisecond Sub-Display -->
  <g transform="translate(400, 290)">
    <rect x="-65" y="-18" width="130" height="26" rx="13" fill="#1e293b" opacity="0.85" />
    <text x="0" y="0" 
          fill="#38bdf8" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" 
          font-weight="700" 
          font-size="14" 
          letter-spacing="1.5" 
          text-anchor="middle" 
          dominant-baseline="central">
      +00:04.812
    </text>
  </g>

  <!-- Big Bold "00" (Transitioning zero point / OMG Overtime moment) -->
  <text x="400" y="380" 
        fill="#ffffff" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Montserrat', sans-serif" 
        font-weight="900" 
        font-size="96" 
        letter-spacing="-3" 
        text-anchor="middle" 
        dominant-baseline="central"
        filter="url(#glowSubtle)">
    00
  </text>

  <!-- Center Pivot / Digital Indicator Dot -->
  <circle cx="400" cy="425" r="5" fill="#f43f5e" />

  <!-- Wordmark / Brand Typography -->
  <g transform="translate(400, 680)">
    <!-- "omgovertime" clean modern typography -->
    <text x="0" y="0" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Poppins', sans-serif" 
          text-anchor="middle" 
          dominant-baseline="central">
      <tspan fill="#f8fafc" font-weight="800" font-size="52" letter-spacing="-1.5">omg</tspan>
      <tspan fill="#ffffff" font-weight="400" font-size="52" letter-spacing="-0.5">overtime</tspan>
    </text>

    <!-- Upward overtime badge arrow right above/beside the wordmark -->
    <path d="M 175 -24 L 196 -24 L 196 -3 L 189 -3 L 189 -15 L 165 9 L 160 4 L 184 -20 L 175 -20 Z" 
          fill="url(#overtimeGrad)" />
  </g>
</svg>

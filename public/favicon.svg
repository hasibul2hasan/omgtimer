<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Outer rounded squircle in solid Indigo -->
  <rect x="2" y="2" width="28" height="28" rx="7.5" fill="#4F46E5" />

  <!-- Stopwatch Crown -->
  <rect x="13.5" y="0.5" width="5" height="2.2" rx="1.1" fill="#3730A3" />

  <!-- Stopwatch Outer Track -->
  <circle cx="16" cy="16.5" r="9.5" stroke="#FFFFFF" stroke-width="1.8" stroke-opacity="0.3" stroke-linecap="round" />

  <!-- Active Overtime Countdown Arc -->
  <path d="M 16 7 A 9.5 9.5 0 1 1 7.5 20" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />

  <!-- Dynamic Overtime Hand / Energy Bolt -->
  <path d="M 16.5 10.5 L 13.8 16.2 H 17.2 L 14.8 22.2 L 19.8 15 H 16.5 L 18 10.5 Z" fill="#FFFFFF" />

  <!-- Overtime Zero Pulse Beacon -->
  <circle cx="23.5" cy="9.5" r="2.2" fill="#EF4444" />
  <circle cx="23.5" cy="9.5" r="0.9" fill="#FFFFFF" />
</svg>
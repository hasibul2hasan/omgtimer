<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#060911" />
    </radialGradient>

    <!-- Warm Overtime Gradient -->
    <linearGradient id="overtimeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3b30" />
      <stop offset="45%" stop-color="#ff6b22" />
      <stop offset="100%" stop-color="#ffaa00" />
    </linearGradient>

    <!-- Glow effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1:1 App Canvas -->
  <rect width="800" height="800" rx="170" fill="url(#bgGrad)" />

  <!-- Confetti / Celebration Elements -->
  <g id="confetti" opacity="0.95">
    <!-- Starbursts -->
    <path d="M 545 130 L 550 144 L 564 149 L 550 154 L 545 168 L 540 154 L 526 149 L 540 144 Z" fill="#ffd166" />
    <path d="M 640 255 L 643 264 L 652 267 L 643 270 L 640 279 L 637 270 L 628 267 L 637 264 Z" fill="#06d6a0" />
    <path d="M 450 78 L 452 85 L 459 87 L 452 89 L 450 96 L 448 89 L 441 87 L 448 85 Z" fill="#ff4d6d" />

    <!-- Streamer Pills -->
    <rect x="560" y="85" width="8" height="22" rx="4" fill="#ff6b22" transform="rotate(38 560 85)" />
    <rect x="500" y="160" width="7" height="19" rx="3.5" fill="#38bdf8" transform="rotate(-30 500 160)" />
    <rect x="615" y="140" width="9" height="18" rx="4" fill="#a855f7" transform="rotate(52 615 140)" />
    <rect x="655" y="305" width="7" height="18" rx="3.5" fill="#ffd166" transform="rotate(75 655 305)" />
    <rect x="475" y="130" width="6.5" height="16" rx="3" fill="#06d6a0" transform="rotate(-45 475 130)" />
    <rect x="385" y="55" width="6" height="15" rx="3" fill="#f72585" transform="rotate(18 385 55)" />

    <!-- Dots & Rings -->
    <circle cx="515" cy="100" r="7" fill="#ff4d6d" />
    <circle cx="600" cy="195" r="6" fill="#ffd166" />
    <circle cx="655" cy="215" r="7.5" fill="#38bdf8" />
    <circle cx="480" cy="70" r="5.5" fill="#06d6a0" />
    <circle cx="630" cy="350" r="5.5" fill="#ff4d6d" />
    <circle cx="490" cy="58" r="10" fill="none" stroke="#ffd166" stroke-width="3" />
    <circle cx="670" cy="165" r="7.5" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <circle cx="598" cy="335" r="6" fill="none" stroke="#a855f7" stroke-width="2" />
  </g>

  <!-- Stopwatch Shell Controls -->
  <!-- Top Stem & Crown -->
  <rect x="384" y="105" width="32" height="30" rx="6" fill="#334155" />
  <rect x="358" y="90" width="84" height="18" rx="8" fill="#f8fafc" />

  <!-- Lap / Start Button (Upper Left) -->
  <g transform="rotate(-40 400 330)">
    <rect x="388" y="112" width="24" height="20" rx="4" fill="#334155" />
    <rect x="376" y="104" width="48" height="12" rx="6" fill="#94a3b8" />
  </g>

  <!-- Stopwatch Body Track (Clockwise sweep from 12 o'clock to Overtime exit) -->
  <path d="M 400 140 A 190 190 0 1 0 540 200" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="22" 
        stroke-linecap="round" />

  <!-- Subtle Inner Guide -->
  <circle cx="400" cy="330" r="152" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="4 8" />

  <!-- Dial Precision Ticks -->
  <line x1="240" y1="330" x2="265" y2="330" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" />
  <line x1="400" y1="490" x2="400" y2="465" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" />
  <line x1="400" y1="168" x2="400" y2="188" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  <line x1="294" y1="436" x2="310" y2="420" stroke="#475569" stroke-width="4" stroke-linecap="round" />
  <line x1="506" y1="436" x2="490" y2="420" stroke="#475569" stroke-width="4" stroke-linecap="round" />
  <line x1="294" y1="224" x2="310" y2="240" stroke="#475569" stroke-width="4" stroke-linecap="round" />

  <!-- OVERTIME EXPLOSION: Wedge & Dynamic Arrow from 12 o'clock forward -->
  <path d="M 400 330 L 400 140 A 190 190 0 0 1 540 200 Z" fill="url(#overtimeGrad)" opacity="0.18" />

  <!-- Overtime Glowing Track Segment -->
  <path d="M 400 140 A 190 190 0 0 1 530 190" 
        fill="none" 
        stroke="url(#overtimeGrad)" 
        stroke-width="22" 
        stroke-linecap="round" />

  <!-- Overtime Breakout Arrow shooting forward -->
  <path d="M 455 168 L 565 125 L 522 225 L 508 186 Z" 
        fill="url(#overtimeGrad)" 
        stroke="#ff6b22" 
        stroke-width="2" 
        stroke-linejoin="round"
        filter="url(#glow)" />

